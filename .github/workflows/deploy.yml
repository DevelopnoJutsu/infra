name: deploy
on:
  workflow_call:
    inputs:
      app: { required: true, type: string }
    secrets:
      SSH_DEPLOY_KEY: { required: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/developnojutsu/${{ inputs.app }}:latest
            ghcr.io/developnojutsu/${{ inputs.app }}:${{ github.sha }}
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          APP: ${{ inputs.app }}
          KNOWN_HOSTS: "__KNOWN_HOSTS__"
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh deploy@62.238.126.0 "$APP"
